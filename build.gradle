plugins {
	id 'java'
	id 'checkstyle'
}

checkstyle {
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
	toolVersion = '10.21.4'
}

configurations.checkstyle {
	attributes {
		// Guava 32.1+ publishes android/jre variants that Gradle 6.x cannot
		// disambiguate; pin checkstyle's resolution to the standard JVM variant.
		attribute(Attribute.of('org.gradle.jvm.environment', String), 'standard-jvm')
	}
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
    testImplementation group: 'com.squareup.okhttp3', name: 'mockwebserver', version: '3.14.9'
}

group = 'net.reldo'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
